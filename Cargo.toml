[package]
name = "TurtleAPIServer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "tls-native-tls"] } 

strum = { version = "0.28.0", features = ["derive"] }
dotenvy = "0.15"
